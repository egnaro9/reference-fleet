name: certification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q

  audit-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the stamp is the last CODE-touching commit; a
                           # shallow clone collapses that to HEAD and fails
                           # the byte-identity diff on the stamp line alone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[audit]"
      - name: re-run the audit and require identical published results
        run: |
          python audit/run_audit.py
          git diff --exit-code board/results.json board/raw_results.jsonl board/vac/
